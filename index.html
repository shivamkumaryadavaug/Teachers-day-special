<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d15">
<title>Teacher's Day — teachers_day.c</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="sparkles" class="sparkles" aria-hidden="true"></div>

<main class="ide" id="ide">
  <div class="tabbar">
    <div class="tabs">
      <span class="tab active">teachers_day.c</span>
      <span class="tab">gratitude.h</span>
      <span class="tab">message.txt</span>
    </div>
    <div class="status-pill"><span class="pulse"></span>Running</div>
  </div>

  <div id="stream" class="stream"></div>

  <button id="replay" class="replay hidden">↻ Run teachers_day.c again</button>

  <div class="statusbar">
    <span>UTF-8</span>
    <span class="sep">•</span>
    <span>C</span>
    <span class="sep">•</span>
    <span id="lncol">Ln 1, Col 1</span>
    <span class="statusbar-fill"></span>
    <span class="statusbar-credit">built with ♥ by Shivam Kumar Yadav</span>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
